[package]
name = "species"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Circle of Life: a zoomable radial tree of every species in the Open Tree of Life"
publish = false

# One package, two targets: `src/lib.rs` (the library, testable) and
# `src/main.rs` (the thin CLI binary that calls into the library).

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
reqwest = { version = "0.13", features = ["json", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
